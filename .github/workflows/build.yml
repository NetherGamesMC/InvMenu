name: PharBuilder

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Download pharbuilder
        uses: dsaltares/fetch-gh-release-asset@0.06
        with:
          file: pharbuilder
          repo: NetherGamesMC/pharbuilder-rs
          token: ${{ secrets.ng_token }}
      - name: Build
        run: |
          chmod +x pharbuilder
          ./pharbuilder . InvMenu.phar
      - name: Upload
        uses: actions/upload-artifact@v2.2.4
        with:
          name: InvMenu
          path: InvMenu.phar
